<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="invite-style.css">
</head>
<body>
    <section id="rsvp">
        <div class="rsvp-container">
            <h1>Phoebe and Mark invite you to their wedding!</h1>
            <h2>RSVP</h2>
            <p>We hope that you'll be able to join us to celebrate! Please reply by February 14th 2027.</p> 
            <form action="" id="rsvp-form" class="rsvp-form">
                <div class="form-group">
                    <label for="name">Name(s) of those invited</label>
                    <input type="text" id="name" placeholder="Mark Williams, Phoebe Cleary, ..." name="names">
                </div>


                <div class="form-group">
                    <label for="rsvp-status">Are all of those invited attending?</label>

                    <label class="radio-option">
                        <input
                            type="radio"
                            value="Yes"
                            name="all_attending"
                            required>
                        Yes
                    </label>
                    <label class="radio-option">
                        <input
                            type="radio"
                            value="No"
                            name="all_attending"
                            id="attending-no"
                            required>
                        No
                    </label>
                </div>

                <div class="form-group" id="additional_names_field">
                    <label for="names_attending">If no, which of the above will be attending?</label>
                    <input type="text" id="names_attending" name="names_attending">
                </div>
                
                <div class="form-group">
                    <label for="dietary_requirements">Dietary requirements or allergies</label>
                    <input type="text" id="dietary_requirements" name="dietary_requirements">
                </div>

                <div class="form-group">
                    <label for="additional">Extras</label>
                    <p>Song requests, well wishes, or anything else you'd like us to know</p>
                    <textarea id="additional"></textarea>
                </div>


                <button type="submit" class="form-button" id="rsvp-submit">RSVP</button>

                <div class="form-helper">
              		<input type="text" name="mobile_number" />
            	  </div>

            </form>
        </div>
    </section>
    <script src="invite.js"></script>
</body>
</html>
