<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="invite-style.css">
    <script src="main.js"></script>
</head>
<body>
    
    <section id="opening">
        <h1>Phee and Mark invite you to our wedding!</h1>
        <p></p>
        
    </section>

    <section id="details">
        <h2>Details</h2> 

        <ul>
            <li>Date: May 29th, 2027</li>
            <li>Time: 12:00 PM</li>
            <li>Mt Pleasant Eco Park, Cornwall</li>
            <li>Dress Code: Dress to impress!</li>
        </ul>
    </section>

    <section id="rsvp">
        <div class="rsvp-container">
            <h2>RSVP</h2>
            <p>We hope that you'll be able to join us to celebrate! Please reply by <strong>February 13th</strong>.</p> 
            <form action="" class="rsvp-form">
                <div class="form-group">
                    <label for="rsvp-status">Will you be attending?</label>

                    <label class="radio-option">
                        <input
                            type="radio"
                            value="Yes"
                            name="attending"
                            required>
                        Yes
                    </label>
                    <label class="radio-option">
                        <input
                            type="radio"
                            value="No"
                            name="attending"
                            required>
                        No
                    </label>
                </div>

                <div class="form-group">
                    <label for="name">Name(s) of those attending</label>
                    <input type="text" id="name" placeholder="Mark Williams, Phoebe Cleary, ..." name="name_s">
                </div>

                <div class="form-group">
                    <label for="additional">Any additional info: dietary requirements, song recommendation, etc.</label>
                    <textarea id="additional"></textarea>
                </div>

                <div class="form-group">
                    <label for="camping">Will you be camping?</label>
                    <label class="radio-option">
                        <input
                            type="radio"
                            id="camping-yes"
                            name="camping"
                            required>
                        Yes
                    </label>
                    <label>
                        <input
                            type="radio"
                            id="camping-no"
                            name="camping"
                            required>
                        No
                    </label>
                </div>

                <div class="camping-group">
                    <h3>Required Camping Information:</h3>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Email" title="Please enter a valid email address" required autocomplete="email">
                    </div>
                    
                    <div class="form-group">
                        <label for="number-of-people">Number of People</label>
                        <input type="number" id="number-of-people" placeholder="Number of People"  name="camping_number" required>
                    </div>
                </div>

                <button type="submit" class="form-button" id="rsvp-submit">RSVP</button>
            </form>
        </div>
    </section>
</body>
</html>
